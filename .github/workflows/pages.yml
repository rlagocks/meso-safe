name: Publish web app (gh-pages branch)
# main의 source/app 이 바뀌면 그 폴더 내용을 gh-pages 브랜치로 올린다.
# GitHub Pages 설정: Source = Deploy from a branch, gh-pages / (root)
on:
  push:
    branches: [main]
    paths: ['source/app/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Push source/app to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix source/app -b gh-pages-tmp
          git push -f origin gh-pages-tmp:gh-pages
